<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc"><title id="title">HumanMimic execution pipeline</title><desc id="desc">Video is estimated by GEM-X, converted from SOMA to SMPL references, then executed by frozen SONIC and G1 in MuJoCo. Actual state feeds back to SONIC. Dashed arrows denote proposed R4 reference adaptation using known geometry, not an implemented capability.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#68675d"/></marker><marker id="warmArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a15033"/></marker></defs><rect width="1200" height="470" fill="#f6f3eb"/><text x="36" y="39" font-family="monospace" font-size="13" letter-spacing="2" fill="#68675d">FROM PIXELS TO PHYSICS</text>
